services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    environment:
      # These are used only during init scripts (see below)
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "JustAnotherPassword"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  # Optional web UI at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2-18
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: "root"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "JustAnotherPassword"
      ME_CONFIG_MONGODB_URL: mongodb://root:JustAnotherPassword@127.0.0.1:27017/?authSource=admin
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
